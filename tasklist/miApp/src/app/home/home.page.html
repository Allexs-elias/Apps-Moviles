<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>TaskMaster Lite</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item>
    <ion-label position="stacked">Nueva Tarea</ion-label>
    <ion-input [(ngModel)]="newTaskStr" placeholder="Ejem: Estudiar typescript"></ion-input>
  </ion-item>
  <ion-button expand="block" color="primary" (click)="addTask()">
    <ion-icon name="add-outline" slot="start"></ion-icon>
    Agregar Tarea
  </ion-button>
  <ion-list>
    <ion-reorder-group (ionItemReorder)="reorderTasks($event)" disabled="false">
      @for(tarea of tasks; track tarea.title) {
        <ion-item-sliding>
          <ion-item>
            <ion-label>
              {{tarea.title}}
            </ion-label>
            <ion-reorder slot="end"></ion-reorder>
          </ion-item>
          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="deleteTask(tarea.id)">
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-reorder-group>
  </ion-list>
</ion-content>
